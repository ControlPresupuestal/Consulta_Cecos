<!doctype html>
<html lang="es" xmlns:mso="urn:schemas-microsoft-com:office:office" xmlns:msdt="uuid:C2F41010-65B3-11d1-A29F-00AA00C14882"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASA | IA · Consulta de CECOs</title>
<style>
:root{--b:#174a8b;--bd:#0f376d;--g:#247a43;--r:#8b1e1e;--y:#d19a00;--yb:#fff6cf;--yt:#725600;--bg:#f5f8fc;--ln:#d7e1ec;--tx:#18324f;--mu:#6b7f95;--sf:#edf4fb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px Segoe UI,Arial,sans-serif;color:var(--tx)}.app{max-width:1500px;margin:auto;padding:16px}.card{background:#fff;border:1px solid var(--ln);border-radius:14px}
.top{padding:14px 18px;border-left:7px solid var(--g);display:flex;justify-content:space-between;align-items:center}.brand{display:flex;gap:12px;align-items:center}.logo{background:var(--b);color:#fff;padding:12px;border-radius:10px;font-weight:900}.ey{font-size:11px;color:var(--g);font-weight:900}.brand h1{margin:2px 0;color:var(--bd);font-size:21px}.meta{font-size:12px;color:var(--mu);text-align:right}
.filters{margin-top:10px;padding:10px;display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px}.searchbox{position:relative}.searchbox input{width:100%;padding-right:38px}.xbtn{display:none;position:absolute;right:5px;top:50%;transform:translateY(-50%);background:transparent;color:var(--mu);font-size:22px;line-height:1;padding:3px 8px}.xbtn:hover{background:#edf2f7;color:var(--tx)}
input,select{border:1px solid var(--ln);border-radius:8px;padding:10px;background:#fff;color:var(--tx)}button{border:0;border-radius:8px;padding:8px 11px;font-weight:800;cursor:pointer}.light{background:#edf2f7;color:var(--tx)}
.summary{margin-top:8px;padding:9px 12px;font-size:12px;color:var(--mu);display:flex;gap:18px;flex-wrap:wrap}.summary b{color:var(--tx)}.layout{display:grid;grid-template-columns:minmax(390px,43%) 1fr;gap:12px;margin-top:10px}.head{padding:11px 14px;background:var(--sf);border-bottom:1px solid var(--ln);font-weight:900;color:var(--bd);display:flex;justify-content:space-between}.tree{padding:9px;max-height:720px;overflow:auto}
.row{display:flex;align-items:center;gap:6px;padding:6px 7px;border-radius:7px;cursor:pointer}.row:hover{background:#eef5fb}.row.sel{background:var(--b);color:#fff}.toggle{width:22px;height:22px;padding:0;border:1px solid #c8d5e3;background:#fff;color:var(--bd)}.leaf{width:22px}.children{margin-left:20px;padding-left:8px;border-left:1px dotted #a8bacd}.hidden{display:none}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:0 0 9px}.active{background:var(--g)}.inactive{background:var(--r)}.warnicon{color:var(--y);font-size:15px;font-weight:900;line-height:1;flex:0 0 15px}.name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.code{font-size:10px;color:var(--mu)}.row.sel .code{color:#dce9f8}
.detail{padding:18px}.empty{padding:55px 20px;text-align:center;color:var(--mu)}.title{border:1px solid var(--ln);border-radius:12px;padding:15px;background:#fbfdff}.title h2{margin:4px 0 10px;color:var(--bd);font-size:21px}.label{font-size:10px;color:var(--mu);font-weight:900;text-transform:uppercase}.badge{display:inline-flex;align-items:center;gap:7px;padding:6px 10px;border-radius:999px;font-weight:900}.badge.a{background:#e8f6ed;color:var(--g)}.badge.i{background:#faeaea;color:var(--r)}
.warningbox{margin-top:11px;border:1px solid #e7c85b;background:var(--yb);color:var(--yt);border-radius:10px;padding:11px 12px;display:flex;gap:9px;align-items:flex-start}.warningbox .wi{font-size:21px;line-height:1}.warningbox b{display:block;margin-bottom:2px}.warningbox span{font-size:12px}
.route{margin-top:11px;color:var(--mu);font-size:12px;line-height:1.5}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.field{border:1px solid var(--ln);border-radius:10px;padding:11px}.value{margin-top:5px;font-weight:800}.cw{display:flex;justify-content:space-between;gap:8px;align-items:center}.account{margin-top:12px;border:1px solid var(--ln);border-radius:10px;overflow:hidden}.account .h{padding:8px 11px;background:var(--sf);font-size:10px;color:var(--mu);font-weight:900}.account .v{padding:13px;display:flex;gap:12px;align-items:center}.anum{font-size:21px;font-weight:900;color:var(--bd)}mark{background:#ffe98b;color:inherit}
.loader{padding:70px 20px;text-align:center;color:var(--mu);font-weight:700}.error{color:var(--r)}
@media(max-width:900px){.filters{grid-template-columns:1fr 1fr}.layout{grid-template-columns:1fr}}@media(max-width:560px){.filters,.grid{grid-template-columns:1fr}}
</style>

</head><body>
<div class="app">
<header class="top card"><div class="brand"><div class="logo">ASA | IA</div><div><div class="ey">MAESTRO DE CENTROS DE COSTO</div><h1>Consulta de CECOs</h1></div></div><div class="meta" id="top">Cargando datos…</div></header>
<section class="filters card"><div class="searchbox"><input id="q" disabled placeholder="🔎 Buscar CECO por nombre o código…"><button id="clearSearch" class="xbtn" title="Borrar búsqueda">×</button></div><select id="origin" disabled><option value="">Todas las empresas</option></select><select id="state" disabled><option value="">Todos los estados</option><option value="ACTIVO">Activos</option><option value="INACTIVO">Inactivos</option></select><button id="clear" class="light" disabled>Limpiar filtros</button></section>
<div id="summary" class="summary card"><span>Cargando información…</span></div>
<div class="layout"><section class="card"><div class="head"><span>Estructura</span><span><button id="expand" class="light" disabled>Expandir todo</button> <button id="collapse" class="light" disabled>Contraer</button></span></div><div id="tree" class="tree"><div class="loader">Cargando CECOs…</div></div></section><section class="card"><div class="head">Ficha del CECO</div><div id="detail" class="detail"><div class="empty">Selecciona un CECO para consultar su información.</div></div></section></div>
</div>
<script>
let DATA=[],RESTRICTED=[],ROOTS=[],open=new Set(),selected='';
const ACCOUNTS={"90":"INVERSIONES","91":"PRODUCCIÓN AGRÍCOLA","92":"PRODUCCIÓN PACKING","94":"GASTOS DE ADMINISTRACIÓN","95":"GASTOS DE VENTAS","97":"GASTOS FINANCIEROS"};
const $=x=>document.getElementById(x),N=s=>String(s??'').trim().toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const NOW=new Date();NOW.setHours(0,0,0,0);let RSET=new Set();
const val=(o,...names)=>{for(const n of names){if(Object.prototype.hasOwnProperty.call(o,n))return String(o[n]??'').trim()}return''};
function normalizeData(raw){
 DATA=(raw.cecos||[]).map(x=>({origen:val(x,'Origen','origen'),jerarquia:val(x,'Jerarquia','jerarquia'),codigo:val(x,'Codigo','codigo'),descripcion:val(x,'Descripcion','descripcion'),inicio:val(x,'Fecha_inicio','fecha_inicio','FECHA_INICIO'),fin:val(x,'Fecha_Fin','fecha_fin','FECHA_FIN'),area:val(x,'Area','area'),cuenta:val(x,'Cuenta','cuenta')}));
 RESTRICTED=(raw.uso_planillas||[]).map(x=>({codigo:val(x,'Codigo','codigo'),jerarquia:val(x,'Jerarquia','jerarquia'),descripcion:val(x,'Descripcion','descripcion')}));
 RSET=new Set(RESTRICTED.map(x=>N(x.codigo)+'|'+N(x.jerarquia)));
}
function restricted(r){return RSET.has(N(r.codigo)+'|'+N(r.jerarquia))}
function st(r){if(!r.fin)return'ACTIVO';return new Date(r.fin+'T23:59:59')>=NOW?'ACTIVO':'INACTIVO'}
function fmt(x){if(!x)return'Sin fecha de baja';let a=x.split('-');return a.length===3?a[2]+'/'+a[1]+'/'+a[0]:x}
function K(r){return r.origen+'|'+r.jerarquia+'|'+r.codigo}function PJ(j){let a=j.split('.');return a.slice(0,-1).join('.')}
function match(r){let q=N($('q').value);return(!$('origin').value||r.origen===$('origin').value)&&(!$('state').value||st(r)===$('state').value)&&(!q||N(r.descripcion+' '+r.codigo).includes(q))}
function build(){let roots=[];for(const o of [...new Set(DATA.map(x=>x.origen))]){let rs=DATA.filter(x=>x.origen===o).map(x=>({...x,ch:[]})),m=new Map(rs.map(x=>[x.jerarquia,x]));rs.forEach(x=>m.has(PJ(x.jerarquia))?m.get(PJ(x.jerarquia)).ch.push(x):roots.push(x))}let s=a=>{a.sort((x,y)=>x.jerarquia.localeCompare(y.jerarquia));a.forEach(x=>s(x.ch))};s(roots);return roots}
function sub(n){return match(n)||n.ch.some(sub)}
function hi(t){let q=$('q').value.trim();if(!q)return E(t);let i=N(t).indexOf(N(q));return i<0?E(t):E(t.slice(0,i))+'<mark>'+E(t.slice(i,i+q.length))+'</mark>'+E(t.slice(i+q.length))}
function node(n){let kids=n.ch.filter(sub),has=kids.length,op=open.has(K(n)),sel=selected===K(n)?' sel':'',rw=restricted(n);return `<div><div class="row${sel}" onclick='pick(${JSON.stringify(K(n))})'>${has?`<button class="toggle" onclick='event.stopPropagation();tog(${JSON.stringify(K(n))})'>${op?'−':'+'}</button>`:'<span class="leaf"></span>'}${rw?'<span class="warnicon" title="Uso exclusivo de Planillas">⚠</span>':''}<span class="dot ${st(n)==='ACTIVO'?'active':'inactive'}"></span><span class="name">${hi(n.descripcion||n.codigo)}</span><span class="code">${E(n.codigo)}</span></div>${has?`<div class="children ${op?'':'hidden'}">${kids.map(node).join('')}</div>`:''}</div>`}
function render(){let rr=ROOTS.filter(sub);$('tree').innerHTML=rr.length?rr.map(node).join(''):'<div class="empty">No se encontraron CECOs.</div>';let a=DATA.filter(match),ac=a.filter(x=>st(x)==='ACTIVO').length,wr=a.filter(restricted).length;$('summary').innerHTML=`<span><b>${a.length.toLocaleString('es-PE')}</b> encontrados</span><span><b>${ac.toLocaleString('es-PE')}</b> activos</span><span><b>${(a.length-ac).toLocaleString('es-PE')}</b> inactivos</span>${wr?`<span>⚠ <b>${wr.toLocaleString('es-PE')}</b> uso exclusivo Planillas</span>`:''}`}
function anc(r){let z=[],p=r.jerarquia.split('.');for(let i=1;i<=p.length;i++){let j=p.slice(0,i).join('.'),x=DATA.find(a=>a.origen===r.origen&&a.jerarquia===j);if(x)z.push(x)}return z}
function detail(r){let s=st(r),route=anc(r).map(x=>x.descripcion||x.codigo).join(' › '),ad=ACCOUNTS[r.cuenta]||'Sin descripción configurada',rw=restricted(r);$('detail').innerHTML=`<div class="title"><div class="label">Centro de costo seleccionado</div><h2>${E(r.descripcion||r.codigo)}</h2><span class="badge ${s==='ACTIVO'?'a':'i'}"><span class="dot ${s==='ACTIVO'?'active':'inactive'}"></span>${s}</span>${rw?'<div class="warningbox"><div class="wi">⚠</div><div><b>USO EXCLUSIVO DE PLANILLAS</b><span>Este centro de costo no debe ser utilizado.</span></div></div>':''}<div class="route">${E(route)}</div></div><div class="grid"><div class="field"><div class="label">Código CECO</div><div class="cw"><div class="value">${E(r.codigo)}</div><button class="light" onclick='copyCode(${JSON.stringify(r.codigo)})'>📋 Copiar</button></div></div><div class="field"><div class="label">Empresa</div><div class="value">${E(r.origen)}</div></div><div class="field"><div class="label">Fecha inicio</div><div class="value">${r.inicio?fmt(r.inicio):'Sin fecha de inicio'}</div></div><div class="field"><div class="label">Fecha fin / baja</div><div class="value">${fmt(r.fin)}</div></div></div><div class="account"><div class="h">CUENTA ASOCIADA</div><div class="v"><span class="anum">${E(r.cuenta||'—')}</span><b>${E(r.cuenta?ad:'Sin cuenta asignada')}</b></div></div>`}
window.tog=k=>{open.has(k)?open.delete(k):open.add(k);render()};window.pick=k=>{selected=k;let r=DATA.find(x=>K(x)===k);if(r){anc(r).slice(0,-1).forEach(x=>open.add(K(x)));render();detail(r)}};window.copyCode=async c=>{try{await navigator.clipboard.writeText(c);let btn=event?.target;if(btn){let old=btn.textContent;btn.textContent='✓ Copiado';setTimeout(()=>btn.textContent=old,1000)}}catch(e){prompt('Copia el código:',c)}};
function autoOpen(){if(!$('q').value.trim())return;DATA.filter(match).forEach(r=>anc(r).slice(0,-1).forEach(x=>open.add(K(x))))}
function enableUI(){['q','origin','state','clear','expand','collapse'].forEach(id=>$(id).disabled=false)}
async function init(){
 try{
   const res=await fetch('./cecos.json?ts='+Date.now(),{cache:'no-store'});
   if(!res.ok)throw new Error('HTTP '+res.status);
   const raw=await res.json(); normalizeData(raw); ROOTS=build();
   [...new Set(DATA.map(x=>x.origen).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es')).forEach(x=>$('origin').add(new Option(x,x)));
   $('top').textContent=DATA.length.toLocaleString('es-PE')+' registros · Datos externos';
   enableUI(); render();
 }catch(err){
   $('top').textContent='Error al cargar datos';
   $('tree').innerHTML='<div class="loader error">No se pudo cargar cecos.json.<br>Verifica que esté en la misma carpeta que este HTML.</div>';
   $('summary').innerHTML='<span class="error">Error: '+E(err.message)+'</span>';
 }
}
$('q').oninput=()=>{$('clearSearch').style.display=$('q').value?'block':'none';autoOpen();render()};$('clearSearch').onclick=()=>{$('q').value='';$('clearSearch').style.display='none';$('q').focus();render()};$('origin').onchange=render;$('state').onchange=render;$('clear').onclick=()=>{$('q').value='';$('clearSearch').style.display='none';$('origin').value='';$('state').value='';open.clear();selected='';$('detail').innerHTML='<div class="empty">Selecciona un CECO para consultar su información.</div>';render()};$('expand').onclick=()=>{DATA.forEach(r=>{if(DATA.some(x=>x.origen===r.origen&&PJ(x.jerarquia)===r.jerarquia))open.add(K(r))});render()};$('collapse').onclick=()=>{open.clear();render()};
init();
</script></body></html>
