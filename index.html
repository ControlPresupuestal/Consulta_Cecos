<div class="app">
<header class="top card"><div class="brand"><div class="logo">ASA | IA</div><div><div class="ey">MAESTRO DE CENTROS DE COSTO</div><h1>Consulta de CECOs</h1></div></div><div class="topnav"><a class="navbtn" href="consulta-masiva.html">Consulta masiva →</a><a class="navbtn" href="validar-carga.html">Validar carga →</a><div class="meta" id="top">Cargando datos…</div></div></header>
<section class="filters card"><div class="searchbox"><input id="q" disabled placeholder="🔎 Buscar CECO por nombre o código…"><button id="clearSearch" class="xbtn" title="Borrar búsqueda">×</button></div><select id="origin" disabled><option value="">Todas las empresas</option></select><select id="state" disabled><option value="">Todos los estados</option><option value="ACTIVO">Activos</option><option value="INACTIVO">Inactivos</option></select><button id="clear" class="light" disabled>Limpiar filtros</button></section>
<div id="summary" class="summary card"><span>Cargando información…</span></div>
<div class="layout"><section class="card"><div class="head"><span>Estructura</span><span><button id="expand" class="light" disabled>Expandir todo</button> <button id="collapse" class="light" disabled>Contraer</button></span></div><div id="tree" class="tree"><div class="loader">Cargando CECOs…</div></div></section><section class="card"><div class="head">Ficha del CECO</div><div id="detail" class="detail"><div class="empty">Selecciona un CECO para consultar su información.</div></div></section></div>


</div>
<script>
let CONS=null,CCACHE={},CUR=null,CLIM=300,HIST={},HMETA='',DATA=[],RESTRICTED=[],ROOTS=[],open=new Set(),selected='';
const ACCOUNTS={"90":"INVERSIONES","91":"PRODUCCIÓN AGRÍCOLA","92":"PRODUCCIÓN PACKING","94":"GASTOS DE ADMINISTRACIÓN","95":"GASTOS DE VENTAS","97":"GASTOS FINANCIEROS"};
const $=x=>document.getElementById(x),N=s=>String(s??'').trim().toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const NOW=new Date();NOW.setHours(0,0,0,0);let RSET=new Set();
const val=(o,...names)=>{for(const n of names){if(Object.prototype.hasOwnProperty.call(o,n))return String(o[n]??'').trim()}return''};
function normalizeData(raw){
 DATA=(raw.cecos||[]).map(x=>({origen:val(x,'Origen','origen'),jerarquia:val(x,'Jerarquia','jerarquia'),codigo:val(x,'Codigo','codigo'),descripcion:val(x,'Descripcion','descripcion'),inicio:val(x,'Fecha_inicio','fecha_inicio','FECHA_INICIO'),fin:val(x,'Fecha_Fin','fecha_fin','FECHA_FIN'),area:val(x,'Area','area'),cuenta:val(x,'Cuenta','cuenta')}));
 RESTRICTED=(raw.uso_planillas||[]).map(x=>({codigo:val(x,'Codigo','codigo'),jerarquia:val(x,'Jerarquia','jerarquia'),descripcion:val(x,'Descripcion','descripcion')}));
 RSET=new Set(RESTRICTED.map(x=>N(x.codigo)+'|'+N(x.jerarquia)));
}
function restricted(r){return RSET.has(N(r.codigo)+'|'+N(r.jerarquia))}
function st(r){if(!r.fin)return'ACTIVO';return new Date(r.fin+'T23:59:59')>=NOW?'ACTIVO':'INACTIVO'}
function hist(r){let o=HIST[r.origen]||{};return o[String(r.codigo||'').trim().toUpperCase()]||[]}
const OLD=new Date();OLD.setFullYear(OLD.getFullYear()-2);
function rinfo(r,rub){let c=String(rub||'').trim().split(/\s+/)[0];return((HIST.rubros||{})[r.origen]||{})[c]||['','','']}
function histHtml(r){let h=hist(r);if(!HMETA)return'';if(!h.length)return`<div class="hist"><div class="h"><span>ÚLTIMO USO · PARTIDA / RUBRO</span></div><div class="nohist">Sin movimientos registrados en el histórico.</div></div>`;
 let l=h[0],ri=rinfo(r,l[1]),rest=h.slice(1),rows=rest.map(x=>`<tr class="${new Date(x[2])<OLD?'old':''}"><td>${E(x[0])}</td><td>${E(x[1])}</td><td style="white-space:nowrap">${fmt(x[2])}</td></tr>`).join('');
 return `<div class="hist"><div class="h"><span>ÚLTIMO USO · PARTIDA / RUBRO</span><span>${fmt(l[2])}</span></div><div class="last"><div class="label">Partida</div><div class="cw"><div class="rb">${E(l[0]||'—')}</div><button class="light" onclick='copyDescription(${JSON.stringify(l[0])})'>📋 Copiar</button></div><div class="label" style="margin-top:8px">Rubro</div><div class="pt"><b>${E(l[1])}</b></div><div class="afc"><div><div class="label">Área</div><div class="value">${E(ri[0]||'—')}</div></div><div><div class="label">Fundo</div><div class="value">${E(ri[1]||'—')}</div></div><div><div class="label">Cultivo</div><div class="value">${E(ri[2]||'—')}</div></div></div></div>${rest.length?`<details class="more"><summary>Ver otros usos (${rest.length})</summary><div class="hscroll"><table class="htable"><thead><tr><th>Partida</th><th>Rubro</th><th>Último uso</th></tr></thead><tbody>${rows}</tbody></table></div><div class="hnote">En gris: sin uso en los últimos 2 años.</div></details>`:''}<div class="hnote">${E(HMETA)}</div></div>`}
function fmt(x){if(!x)return'Sin fecha de baja';let a=x.split('-');return a.length===3?a[2]+'/'+a[1]+'/'+a[0]:x}
function K(r){return r.origen+'|'+r.jerarquia+'|'+r.codigo}function PJ(j){let a=j.split('.');return a.slice(0,-1).join('.')}
function match(r){let q=N($('q').value);return(!$('origin').value||r.origen===$('origin').value)&&(!$('state').value||st(r)===$('state').value)&&(!q||N(r.descripcion+' '+r.codigo).includes(q))}
function build(){let roots=[];for(const o of [...new Set(DATA.map(x=>x.origen))]){let rs=DATA.filter(x=>x.origen===o).map(x=>({...x,ch:[]})),m=new Map(rs.map(x=>[x.jerarquia,x]));rs.forEach(x=>m.has(PJ(x.jerarquia))?m.get(PJ(x.jerarquia)).ch.push(x):roots.push(x))}let s=a=>{a.sort((x,y)=>x.jerarquia.localeCompare(y.jerarquia));a.forEach(x=>s(x.ch))};s(roots);return roots}
function sub(n){return match(n)||n.ch.some(sub)}
function hi(t){let q=$('q').value.trim();if(!q)return E(t);let i=N(t).indexOf(N(q));return i<0?E(t):E(t.slice(0,i))+'<mark>'+E(t.slice(i,i+q.length))+'</mark>'+E(t.slice(i+q.length))}
function node(n){let kids=n.ch.filter(sub),has=kids.length,op=open.has(K(n)),sel=selected===K(n)?' sel':'',rw=restricted(n);return `<div><div class="row${sel}" onclick='pick(${JSON.stringify(K(n))})'>${has?`<button class="toggle" onclick='event.stopPropagation();tog(${JSON.stringify(K(n))})'>${op?'−':'+'}</button>`:'<span class="leaf"></span>'}${rw?'<span class="warnicon" title="Uso exclusivo de Planillas">⚠</span>':''}<span class="dot ${st(n)==='ACTIVO'?'active':'inactive'}"></span><span class="name">${hi(n.descripcion||n.codigo)}</span><span class="code">${E(n.codigo)}</span></div>${has?`<div class="children ${op?'':'hidden'}">${kids.map(node).join('')}</div>`:''}</div>`}
function render(){let rr=ROOTS.filter(sub);$('tree').innerHTML=rr.length?rr.map(node).join(''):'<div class="empty">No se encontraron CECOs.</div>';let a=DATA.filter(match),ac=a.filter(x=>st(x)==='ACTIVO').length,wr=a.filter(restricted).length;$('summary').innerHTML=`<span><b>${a.length.toLocaleString('es-PE')}</b> encontrados</span><span><b>${ac.toLocaleString('es-PE')}</b> activos</span><span><b>${(a.length-ac).toLocaleString('es-PE')}</b> inactivos</span>${wr?`<span>⚠ <b>${wr.toLocaleString('es-PE')}</b> uso exclusivo Planillas</span>`:''}`}
function anc(r){let z=[],p=r.jerarquia.split('.');for(let i=1;i<=p.length;i++){let j=p.slice(0,i).join('.'),x=DATA.find(a=>a.origen===r.origen&&a.jerarquia===j);if(x)z.push(x)}return z}
function detail(r){let s=st(r),route=anc(r).map(x=>x.descripcion||x.codigo).join(' › '),ad=ACCOUNTS[r.cuenta]||'Sin descripción configurada',rw=restricted(r);$('detail').innerHTML=`<div class="title"><div class="label">Centro de costo seleccionado</div><div class="cw"><h2>${E(r.descripcion||r.codigo)}</h2><button class="light" onclick='copyDescription(${JSON.stringify(r.descripcion||r.codigo)})'>📋 Copiar</button></div><span class="badge ${s==='ACTIVO'?'a':'i'}"><span class="dot ${s==='ACTIVO'?'active':'inactive'}"></span>${s}</span>${rw?'<div class="warningbox"><div class="wi">⚠</div><div><b>USO EXCLUSIVO DE PLANILLAS</b><span>Este centro de costo no debe ser utilizado.</span></div></div>':''}<div class="route">${E(route)}</div></div><div class="grid"><div class="field"><div class="label">Código CECO</div><div class="cw"><div class="value">${E(r.codigo)}</div><button class="light" onclick='copyCode(${JSON.stringify(r.codigo)})'>📋 Copiar</button></div></div><div class="field"><div class="label">Empresa</div><div class="value">${E(r.origen)}</div></div><div class="field"><div class="label">Fecha inicio</div><div class="value">${r.inicio?fmt(r.inicio):'Sin fecha de inicio'}</div></div><div class="field"><div class="label">Fecha fin / baja</div><div class="value">${fmt(r.fin)}</div></div></div><div class="account"><div class="h">CUENTA ASOCIADA</div><div class="v"><span class="anum">${E(r.cuenta||'—')}</span><b>${E(r.cuenta?ad:'Sin cuenta asignada')}</b></div></div>${histHtml(r)}${consHtml(r)}`}
window.tog=k=>{open.has(k)?open.delete(k):open.add(k);render()};window.pick=k=>{selected=k;let r=DATA.find(x=>K(x)===k);if(r){anc(r).slice(0,-1).forEach(x=>open.add(K(x)));render();detail(r)}};window.copyCode=async c=>{try{await navigator.clipboard.writeText(c);let btn=event?.target;if(btn){let old=btn.textContent;btn.textContent='✓ Copiado';setTimeout(()=>btn.textContent=old,1000)}}catch(e){prompt('Copia el código:',c)}};
window.copyDescription=async d=>{try{await navigator.clipboard.writeText(d);let btn=event?.target;if(btn){let old=btn.textContent;btn.textContent='✓ Copiado';setTimeout(()=>btn.textContent=old,1000)}}catch(e){prompt('Copia la descripción:',d)}};
function autoOpen(){if(!$('q').value.trim())return;DATA.filter(match).forEach(r=>anc(r).slice(0,-1).forEach(x=>open.add(K(x))))}
function enableUI(){['q','origin','state','clear','expand','collapse'].forEach(id=>$(id).disabled=false)}

/* ---------- CONSUMOS (sin importes) ---------- */
const PM=p=>['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Set','Oct','Nov','Dic'][+p.slice(4)-1]+' '+p.slice(2,4);
const NF=x=>x==null?'':Number(x).toLocaleString('es-PE',{maximumFractionDigits:3});
const NI=x=>x.toLocaleString('es-PE');
function consHtml(r){if(!CONS||!CONS[r.origen])return'';let per=CONS.periodos||[],rg=per.length?PM(per[0])+' – '+PM(per[per.length-1]):'',c=CONS[r.origen][String(r.codigo).trim()];
 if(!c)return`<div class="cons"><div class="h"><span>CONSUMOS · ${E(rg)}</span></div><div class="nohist">Sin consumos registrados en el periodo.</div></div>`;
 return`<div class="cons"><div class="h"><span>CONSUMOS · ${E(rg)}</span><span>Sin importes</span></div><div class="intro"><span><b>${NI(c[1])}</b> movimientos registrados</span><button class="pbtn" onclick='verCons(${JSON.stringify(r.origen)},${JSON.stringify(String(r.codigo).trim())},this)'>Ver consumos</button></div><div id="consBody"></div></div>`}
window.verCons=async(o,code,btn)=>{let b=$('consBody');if(b.dataset.code===code&&b.innerHTML){b.innerHTML='';b.dataset.code='';btn.textContent='Ver consumos';return}
 btn.textContent='Cargando…';btn.disabled=true;
 try{let ci=CONS[o][code][0],f=`./consumos/${o}_${String(ci).padStart(3,'0')}.json`;if(!CCACHE[f]){let res=await fetch(f+'?ts='+CONS.generado);if(!res.ok)throw new Error('HTTP '+res.status);CCACHE[f]=await res.json()}
  CUR=CCACHE[f][code];RS={k:-1,d:-1};DS={k:0,d:-1};OPEN={};b.dataset.code=code;
  b.innerHTML=`<h4>Resumen por rubro y partida · N° de movimientos</h4><div class="cnote" style="padding-top:0"><span>Clic en una fila para ver sus movimientos; clic en un número para ver solo ese mes. Clic en un encabezado para ordenar.</span></div><div class="xs" id="cres" style="max-height:620px"></div><div class="cnote"><span>Fuente: ${E(CONS.fuente)}, generado ${fmt(CONS.generado)}.</span></div>`;
  drawRes();btn.textContent='Ocultar consumos'}
 catch(e){b.innerHTML='<div class="nohist error">No se pudo cargar el detalle ('+E(e.message)+').</div>';btn.textContent='Ver consumos'}btn.disabled=false};
let RS={k:-1,d:-1},DS={k:0,d:-1},OPEN={};
const CMP=(x,y,num)=>num?(x-y):String(x).localeCompare(String(y),'es',{numeric:true,sensitivity:'base'});
const BL=v=>v==null||v==='';
const SORT=(x,y,d,num)=>BL(x)&&BL(y)?0:BL(x)?1:BL(y)?-1:d*CMP(x,y,num);
const ARW=(S,i)=>S.k===i?(S.d>0?' ▲':' ▼'):' <span style="opacity:.35">⇅</span>';
window.sortR=i=>{RS.k===i?RS.d=-RS.d:(RS.k=i,RS.d=i<2?1:-1);drawRes()};
window.sortD=(i,ev)=>{ev&&ev.stopPropagation();DS.k===i?DS.d=-DS.d:(DS.k=i,DS.d=(i===0||i===3)?-1:1);drawRes()};
window.togR=(k,pe,ev)=>{ev&&ev.stopPropagation();if(OPEN[k]&&OPEN[k].pe===pe)delete OPEN[k];else OPEN[k]={pe,lim:200};drawRes()};
window.moreR=(k,ev)=>{ev.stopPropagation();OPEN[k].lim+=500;drawRes()};
function subHtml(k,ru,pa,o){let a=CUR.d.filter(x=>x[6]===ru&&x[5]===pa&&(!o.pe||x[0].replace('-','').slice(0,6)===o.pe));
 a=a.slice().sort((x,y)=>SORT(x[DS.k],y[DS.k],DS.d,DS.k===3)||(y[0]<x[0]?-1:y[0]>x[0]?1:0));
 let mv=a.reduce((s,x)=>s+x[7],0),hd=['Fecha','Artículo','Cuenta','Cantidad','Labor'];
 return`<div class="subw"><div class="subt">${o.pe?'Movimientos de '+PM(o.pe):'Todos los movimientos'} · ${NI(mv)} mov. en ${NI(a.length)} líneas${o.pe?` <a href="#" onclick='togR(${JSON.stringify(k)},"",event);return false'>ver todos los meses</a>`:''}</div><table class="ctable sub"><thead><tr>${hd.map((h,i)=>`<th class="${i===3?'n ':''}srt" onclick="sortD(${i},event)">${h}${ARW(DS,i)}</th>`).join('')}</tr></thead><tbody>${a.slice(0,o.lim).map(x=>`<tr><td style="white-space:nowrap">${fmt(x[0])}</td><td>${E(x[1]||'—')}${x[7]>1?`<span class="rep" title="Movimientos agrupados con la misma fecha, artículo, cuenta y labor">${x[7]}×</span>`:''}</td><td>${E(x[2])}</td><td class="n">${NF(x[3])}</td><td>${E(x[4]||'—')}</td></tr>`).join('')}</tbody></table>${a.length>o.lim?`<div class="cnote"><span>Mostrando ${NI(o.lim)} de ${NI(a.length)} líneas</span><button class="light" onclick='moreR(${JSON.stringify(k)},event)'>Mostrar más</button></div>`:''}</div>`}
function drawRes(){let per=CONS.periodos,tot=per.map(()=>0),nc=per.length+3,
 rows=CUR.r.map(([pa,ru,v])=>[ru,pa,...v,v.reduce((a,b)=>a+b,0)]);
 rows.forEach(r=>per.forEach((_,i)=>tot[i]+=r[i+2]));
 if(RS.k>=0)rows.sort((x,y)=>SORT(x[RS.k],y[RS.k],RS.d,RS.k>=2));
 let hd=['Rubro','Partida',...per.map(PM),'Total'];
 $('cres').innerHTML=`<table class="ctable"><thead><tr>${hd.map((h,i)=>`<th class="${i>=2?'n ':''}srt" onclick="sortR(${i})">${h}${ARW(RS,i)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>{let k=r[0]+'|'+r[1],o=OPEN[k],K2=JSON.stringify(k);
  return`<tr class="rrow${o?' ropen':''}" onclick='togR(${K2},"",event)'><td><span class="car">${o?'▾':'▸'}</span>${E(r[0])}</td><td>${E(r[1])}</td>${r.slice(2,-1).map((x,i)=>`<td class="n${x?' cl':' z'}${o&&o.pe===per[i]?' psel':''}"${x?` onclick='togR(${K2},"${per[i]}",event)' title="Ver movimientos de ${PM(per[i])}"`:''}>${x?NI(x):'–'}</td>`).join('')}<td class="n"><b>${NI(r[r.length-1])}</b></td></tr>${o?`<tr class="subrow"><td colspan="${nc}">${subHtml(k,r[0],r[1],o)}</td></tr>`:''}`}).join('')}<tr class="tot"><td colspan="2">Total</td>${tot.map(x=>`<td class="n">${NI(x)}</td>`).join('')}<td class="n">${NI(tot.reduce((a,b)=>a+b,0))}</td></tr></tbody></table>`}
async function init(){
 try{
   const res=await fetch('./cecos.json?ts='+Date.now(),{cache:'no-store'});
   if(!res.ok)throw new Error('HTTP '+res.status);
   const raw=await res.json(); normalizeData(raw); ROOTS=build();
   try{const hr=await fetch('./historico.json?ts='+Date.now(),{cache:'no-store'});if(hr.ok){HIST=await hr.json();HMETA='Histórico actualizado al '+fmt(HIST.generado||'')}}catch(e){}
   try{const cr=await fetch('./consumos/index.json?ts='+Date.now(),{cache:'no-store'});if(cr.ok)CONS=await cr.json()}catch(e){}
   [...new Set(DATA.map(x=>x.origen).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es')).forEach(x=>$('origin').add(new Option(x,x)));
   $('top').textContent=DATA.length.toLocaleString('es-PE')+' registros · Datos externos';
   enableUI(); render();
 }catch(err){
   $('top').textContent='Error al cargar datos';
   $('tree').innerHTML='<div class="loader error">No se pudo cargar cecos.json.<br>Verifica que esté en la misma carpeta que este HTML.</div>';
   $('summary').innerHTML='<span class="error">Error: '+E(err.message)+'</span>';
 }
}
$('q').oninput=()=>{$('clearSearch').style.display=$('q').value?'block':'none';autoOpen();render()};$('clearSearch').onclick=()=>{$('q').value='';$('clearSearch').style.display='none';$('q').focus();render()};$('origin').onchange=render;$('state').onchange=render;$('clear').onclick=()=>{$('q').value='';$('clearSearch').style.display='none';$('origin').value='';$('state').value='';open.clear();selected='';$('detail').innerHTML='<div class="empty">Selecciona un CECO para consultar su información.</div>';render()};$('expand').onclick=()=>{DATA.forEach(r=>{if(DATA.some(x=>x.origen===r.origen&&PJ(x.jerarquia)===r.jerarquia))open.add(K(r))});render()};$('collapse').onclick=()=>{open.clear();render()};


init();
</script></body></html>
