<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASA | IA · Consumos del CECO</title>
<style>
:root{--b:#174a8b;--bd:#0f376d;--g:#247a43;--r:#8b1e1e;--y:#d19a00;--yb:#fff6cf;--yt:#725600;--bg:#f5f8fc;--ln:#d7e1ec;--tx:#18324f;--mu:#6b7f95;--sf:#edf4fb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px Segoe UI,Arial,sans-serif;color:var(--tx)}.app{max-width:1500px;margin:auto;padding:16px}.card{background:#fff;border:1px solid var(--ln);border-radius:14px}
.top{padding:14px 18px;border-left:7px solid var(--g);display:flex;justify-content:space-between;align-items:center}.brand{display:flex;gap:12px;align-items:center}.logo{background:var(--b);color:#fff;padding:12px;border-radius:10px;font-weight:900}.ey{font-size:11px;color:var(--g);font-weight:900}.brand h1{margin:2px 0;color:var(--bd);font-size:21px}.meta{font-size:12px;color:var(--mu);text-align:right}.topnav{display:flex;gap:8px;align-items:center}.navbtn{background:var(--b);color:#fff;text-decoration:none;padding:9px 12px;border-radius:8px;font-weight:800;white-space:nowrap}
.filters{margin-top:10px;padding:10px;display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px}.searchbox{position:relative}.searchbox input{width:100%;padding-right:38px}.xbtn{display:none;position:absolute;right:5px;top:50%;transform:translateY(-50%);background:transparent;color:var(--mu);font-size:22px;line-height:1;padding:3px 8px}.xbtn:hover{background:#edf2f7;color:var(--tx)}
input,select{border:1px solid var(--ln);border-radius:8px;padding:10px;background:#fff;color:var(--tx)}button{border:0;border-radius:8px;padding:8px 11px;font-weight:800;cursor:pointer}.light{background:#edf2f7;color:var(--tx)}
.summary{margin-top:8px;padding:9px 12px;font-size:12px;color:var(--mu);display:flex;gap:18px;flex-wrap:wrap}.summary b{color:var(--tx)}.layout{display:grid;grid-template-columns:minmax(390px,43%) 1fr;gap:12px;margin-top:10px}.head{padding:11px 14px;background:var(--sf);border-bottom:1px solid var(--ln);font-weight:900;color:var(--bd);display:flex;justify-content:space-between}.tree{padding:9px;max-height:720px;overflow:auto}
.row{display:flex;align-items:center;gap:6px;padding:6px 7px;border-radius:7px;cursor:pointer}.row:hover{background:#eef5fb}.row.sel{background:var(--b);color:#fff}.toggle{width:22px;height:22px;padding:0;border:1px solid #c8d5e3;background:#fff;color:var(--bd)}.leaf{width:22px}.children{margin-left:20px;padding-left:8px;border-left:1px dotted #a8bacd}.hidden{display:none}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:0 0 9px}.active{background:var(--g)}.inactive{background:var(--r)}.warnicon{color:var(--y);font-size:15px;font-weight:900;line-height:1;flex:0 0 15px}.name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.code{font-size:10px;color:var(--mu)}.row.sel .code{color:#dce9f8}
.detail{padding:18px}.empty{padding:55px 20px;text-align:center;color:var(--mu)}.title{border:1px solid var(--ln);border-radius:12px;padding:15px;background:#fbfdff}.title h2{margin:4px 0 10px;color:var(--bd);font-size:21px}.label{font-size:10px;color:var(--mu);font-weight:900;text-transform:uppercase}.badge{display:inline-flex;align-items:center;gap:7px;padding:6px 10px;border-radius:999px;font-weight:900}.badge.a{background:#e8f6ed;color:var(--g)}.badge.i{background:#faeaea;color:var(--r)}
.warningbox{margin-top:11px;border:1px solid #e7c85b;background:var(--yb);color:var(--yt);border-radius:10px;padding:11px 12px;display:flex;gap:9px;align-items:flex-start}.warningbox .wi{font-size:21px;line-height:1}.warningbox b{display:block;margin-bottom:2px}.warningbox span{font-size:12px}
.route{margin-top:11px;color:var(--mu);font-size:12px;line-height:1.5}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.field{border:1px solid var(--ln);border-radius:10px;padding:11px}.value{margin-top:5px;font-weight:800}.cw{display:flex;justify-content:space-between;gap:8px;align-items:center}.account{margin-top:12px;border:1px solid var(--ln);border-radius:10px;overflow:hidden}.account .h{padding:8px 11px;background:var(--sf);font-size:10px;color:var(--mu);font-weight:900}.account .v{padding:13px;display:flex;gap:12px;align-items:center}.anum{font-size:21px;font-weight:900;color:var(--bd)}mark{background:#ffe98b;color:inherit}
.loader{padding:70px 20px;text-align:center;color:var(--mu);font-weight:700}.error{color:var(--r)}
@media(max-width:900px){.filters{grid-template-columns:1fr 1fr}.layout{grid-template-columns:1fr}}@media(max-width:560px){.filters,.grid{grid-template-columns:1fr}}

.hist{margin-top:12px;border:1px solid var(--ln);border-radius:10px;overflow:hidden}.hist .h{padding:8px 11px;background:var(--sf);font-size:10px;color:var(--mu);font-weight:900;display:flex;justify-content:space-between}.last{padding:12px 13px;border-bottom:1px solid var(--ln);background:#f3faf5}.last .label{color:var(--g)}.last .rb{font-weight:900;color:var(--bd);margin-top:4px}.last .pt{margin-top:3px}.last .fx{font-size:12px;color:var(--mu);margin-top:3px}.htable{width:100%;border-collapse:collapse;font-size:12px}.htable th{text-align:left;padding:7px 10px;color:var(--mu);font-size:10px;text-transform:uppercase;border-bottom:1px solid var(--ln)}.htable td{padding:7px 10px;border-bottom:1px solid #edf2f7;vertical-align:top}.htable tr.old td{color:#9aa9b9}.hscroll{max-height:300px;overflow:auto}.hnote{padding:8px 11px;font-size:11px;color:var(--mu)}.afc{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px;padding-top:10px;border-top:1px dashed #cfe3d6}.more summary{cursor:pointer;padding:9px 11px;font-weight:800;color:var(--b);border-top:1px solid var(--ln)}.more[open] summary{border-bottom:1px solid var(--ln)}.nohist{padding:14px;color:var(--mu)}
.cons{margin-top:12px;border:1px solid var(--ln);border-radius:10px;overflow:hidden}.cons .h{padding:8px 11px;background:var(--sf);font-size:10px;color:var(--mu);font-weight:900;display:flex;justify-content:space-between;align-items:center;gap:8px}.cons .intro{padding:12px 13px;display:flex;justify-content:space-between;align-items:center;gap:10px}.cons .intro b{color:var(--bd)}.pbtn{background:var(--b);color:#fff}.cons h4{margin:0;padding:10px 13px 6px;color:var(--bd);font-size:12px;text-transform:uppercase}.xs{overflow:auto;max-height:340px;border-top:1px solid var(--ln)}.ctable{width:100%;border-collapse:collapse;font-size:12px}.ctable th{position:sticky;top:0;background:#fff;text-align:left;padding:7px 9px;color:var(--mu);font-size:10px;text-transform:uppercase;border-bottom:1px solid var(--ln);white-space:nowrap}.ctable td{padding:6px 9px;border-bottom:1px solid #edf2f7;vertical-align:top}.ctable td.n,.ctable th.n{text-align:right;white-space:nowrap}.ctable td.z{color:#c3ceda}.ctable tr.tot td{font-weight:900;background:var(--sf)}.cf{display:grid;grid-template-columns:2fr 1fr 1.4fr;gap:6px;padding:0 13px 8px}.cf input,.cf select{padding:7px;font-size:12px}.rep{display:inline-block;margin-left:5px;padding:1px 6px;border-radius:999px;background:#edf2f7;color:var(--mu);font-size:10px;font-weight:800}.rrow{cursor:pointer}.rrow:hover td{background:#f3f8fd}.ropen td{background:#eaf2fb;font-weight:700}.car{display:inline-block;width:14px;color:var(--b)}.cl{cursor:pointer;color:var(--b);text-decoration:underline dotted}.psel{background:#ffe98b!important}.subrow>td{padding:0 0 0 22px!important;background:#fbfdff}.subw{border-left:3px solid var(--b);margin:4px 0 10px}.subt{padding:7px 9px;font-size:11px;color:var(--mu);font-weight:700}.ctable.sub th{position:static;background:#f6f9fc}.srt{cursor:pointer;user-select:none}.srt:hover{color:var(--b)}.cnote{padding:8px 13px;font-size:11px;color:var(--mu);display:flex;justify-content:space-between;align-items:center;gap:8px}


/* Navegación uniforme y siempre visible */
.top{position:sticky;top:8px;z-index:50;box-shadow:0 5px 18px rgba(15,55,109,.10)}
.nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.navbtn.active{background:var(--g);color:#fff;pointer-events:none}
@media(max-width:760px){.top{align-items:flex-start;flex-direction:column}.topnav{width:100%;align-items:flex-start!important;flex-direction:column}.nav{width:100%}.navbtn{flex:1;text-align:center}}

.topnav{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.navbtn{background:#edf2f7;color:var(--tx)}.page{margin-top:12px}.cecohead{padding:15px 18px;display:flex;justify-content:space-between;gap:12px;align-items:center}.cecohead h2{margin:3px 0;color:var(--bd)}.back{color:var(--b);font-weight:800;text-decoration:none}.cons{margin-top:0}.cons .intro{display:none}.pbtn{text-decoration:none;display:inline-block}
@media(max-width:760px){.cecohead{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="app">
<header class="top card"><div class="brand"><div class="logo">ASA | IA</div><div><div class="ey">MAESTRO DE CENTROS DE COSTO</div><h1>Consumos del CECO</h1></div></div><div class="topnav"><nav class="nav" aria-label="Navegación principal">
<a class="navbtn" href="index.html">Consulta individual</a>
<a class="navbtn" href="consulta-masiva.html">Consulta masiva</a>
<a class="navbtn" href="validar-carga.html">Validar carga</a>
<a class="navbtn" href="cecos-por-area.html">Por área</a>
</nav></div></header>
<section class="cecohead card page"><div><div class="label">Centro de costo</div><h2 id="cecoTitle">Cargando…</h2><div id="cecoMeta" class="meta" style="text-align:left"></div></div><a class="back" href="index.html">← Volver a consulta individual</a></section>
<section class="cons card page"><div class="h"><span id="periodTitle">CONSUMOS</span><span>Sin importes</span></div><div id="consBody"><div class="loader">Cargando consumos…</div></div></section>
<button id="loadButton" hidden></button>
</div><script>
let CONS=null,CCACHE={},CUR=null,CLIM=300;
const $=x=>document.getElementById(x),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fmt(x){if(!x)return'';let a=String(x).split('-');return a.length===3?a[2]+'/'+a[1]+'/'+a[0]:x}
/* ---------- CONSUMOS (sin importes) ---------- */
const PM=p=>['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Set','Oct','Nov','Dic'][+p.slice(4)-1]+' '+p.slice(2,4);
const NF=x=>x==null?'':Number(x).toLocaleString('es-PE',{maximumFractionDigits:3});
const NI=x=>x.toLocaleString('es-PE');
function consHtml(r){if(!CONS||!CONS[r.origen])return'';let per=CONS.periodos||[],rg=per.length?PM(per[0])+' – '+PM(per[per.length-1]):'',c=CONS[r.origen][String(r.codigo).trim()];
 if(!c)return`<div class="cons"><div class="h"><span>CONSUMOS · ${E(rg)}</span></div><div class="nohist">Sin consumos registrados en el periodo.</div></div>`;
 return`<div class="cons"><div class="h"><span>CONSUMOS · ${E(rg)}</span><span>Sin importes</span></div><div class="intro"><span><b>${NI(c[1])}</b> movimientos registrados</span><button class="pbtn" onclick='verCons(${JSON.stringify(r.origen)},${JSON.stringify(String(r.codigo).trim())},this)'>Ver consumos</button></div><div id="consBody"></div></div>`}
window.verCons=async(o,code,btn)=>{let b=$('consBody');if(b.dataset.code===code&&b.innerHTML){b.innerHTML='';b.dataset.code='';btn.textContent='Ver consumos';return}
 btn.textContent='Cargando…';btn.disabled=true;
 try{let ci=CONS[o][code][0],f=`./consumos/${o}_${String(ci).padStart(3,'0')}.json`;if(!CCACHE[f]){let res=await fetch(f+'?ts='+CONS.generado);if(!res.ok)throw new Error('HTTP '+res.status);CCACHE[f]=await res.json()}
  CUR=CCACHE[f][code];RS={k:-1,d:-1};DS={k:0,d:-1};OPEN={};b.dataset.code=code;
  b.innerHTML=`<h4>Resumen por rubro y partida · N° de movimientos</h4><div class="cnote" style="padding-top:0"><span>Clic en una fila para ver sus movimientos; clic en un número para ver solo ese mes. Clic en un encabezado para ordenar.</span></div><div class="xs" id="cres" style="max-height:620px"></div><div class="cnote"><span>Fuente: ${E(CONS.fuente)}, generado ${fmt(CONS.generado)}.</span></div>`;
  drawRes();btn.textContent='Ocultar consumos'}
 catch(e){b.innerHTML='<div class="nohist error">No se pudo cargar el detalle ('+E(e.message)+').</div>';btn.textContent='Ver consumos'}btn.disabled=false};
let RS={k:-1,d:-1},DS={k:0,d:-1},OPEN={};
const CMP=(x,y,num)=>num?(x-y):String(x).localeCompare(String(y),'es',{numeric:true,sensitivity:'base'});
const BL=v=>v==null||v==='';
const SORT=(x,y,d,num)=>BL(x)&&BL(y)?0:BL(x)?1:BL(y)?-1:d*CMP(x,y,num);
const ARW=(S,i)=>S.k===i?(S.d>0?' ▲':' ▼'):' <span style="opacity:.35">⇅</span>';
window.sortR=i=>{RS.k===i?RS.d=-RS.d:(RS.k=i,RS.d=i<2?1:-1);drawRes()};
window.sortD=(i,ev)=>{ev&&ev.stopPropagation();DS.k===i?DS.d=-DS.d:(DS.k=i,DS.d=(i===0||i===3)?-1:1);drawRes()};
window.togR=(k,pe,ev)=>{ev&&ev.stopPropagation();if(OPEN[k]&&OPEN[k].pe===pe)delete OPEN[k];else OPEN[k]={pe,lim:200};drawRes()};
window.moreR=(k,ev)=>{ev.stopPropagation();OPEN[k].lim+=500;drawRes()};
function subHtml(k,ru,pa,o){let a=CUR.d.filter(x=>x[6]===ru&&x[5]===pa&&(!o.pe||x[0].replace('-','').slice(0,6)===o.pe));
 a=a.slice().sort((x,y)=>SORT(x[DS.k],y[DS.k],DS.d,DS.k===3)||(y[0]<x[0]?-1:y[0]>x[0]?1:0));
 let mv=a.reduce((s,x)=>s+x[7],0),hd=['Fecha','Artículo','Cuenta','Cantidad','Labor'];
 return`<div class="subw"><div class="subt">${o.pe?'Movimientos de '+PM(o.pe):'Todos los movimientos'} · ${NI(mv)} mov. en ${NI(a.length)} líneas${o.pe?` <a href="#" onclick='togR(${JSON.stringify(k)},"",event);return false'>ver todos los meses</a>`:''}</div><table class="ctable sub"><thead><tr>${hd.map((h,i)=>`<th class="${i===3?'n ':''}srt" onclick="sortD(${i},event)">${h}${ARW(DS,i)}</th>`).join('')}</tr></thead><tbody>${a.slice(0,o.lim).map(x=>`<tr><td style="white-space:nowrap">${fmt(x[0])}</td><td>${E(x[1]||'—')}${x[7]>1?`<span class="rep" title="Movimientos agrupados con la misma fecha, artículo, cuenta y labor">${x[7]}×</span>`:''}</td><td>${E(x[2])}</td><td class="n">${NF(x[3])}</td><td>${E(x[4]||'—')}</td></tr>`).join('')}</tbody></table>${a.length>o.lim?`<div class="cnote"><span>Mostrando ${NI(o.lim)} de ${NI(a.length)} líneas</span><button class="light" onclick='moreR(${JSON.stringify(k)},event)'>Mostrar más</button></div>`:''}</div>`}
function drawRes(){let per=CONS.periodos,tot=per.map(()=>0),nc=per.length+3,
 rows=CUR.r.map(([pa,ru,v])=>[ru,pa,...v,v.reduce((a,b)=>a+b,0)]);
 rows.forEach(r=>per.forEach((_,i)=>tot[i]+=r[i+2]));
 if(RS.k>=0)rows.sort((x,y)=>SORT(x[RS.k],y[RS.k],RS.d,RS.k>=2));
 let hd=['Rubro','Partida',...per.map(PM),'Total'];
 $('cres').innerHTML=`<table class="ctable"><thead><tr>${hd.map((h,i)=>`<th class="${i>=2?'n ':''}srt" onclick="sortR(${i})">${h}${ARW(RS,i)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>{let k=r[0]+'|'+r[1],o=OPEN[k],K2=JSON.stringify(k);
  return`<tr class="rrow${o?' ropen':''}" onclick='togR(${K2},"",event)'><td><span class="car">${o?'▾':'▸'}</span>${E(r[0])}</td><td>${E(r[1])}</td>${r.slice(2,-1).map((x,i)=>`<td class="n${x?' cl':' z'}${o&&o.pe===per[i]?' psel':''}"${x?` onclick='togR(${K2},"${per[i]}",event)' title="Ver movimientos de ${PM(per[i])}"`:''}>${x?NI(x):'–'}</td>`).join('')}<td class="n"><b>${NI(r[r.length-1])}</b></td></tr>${o?`<tr class="subrow"><td colspan="${nc}">${subHtml(k,r[0],r[1],o)}</td></tr>`:''}`}).join('')}<tr class="tot"><td colspan="2">Total</td>${tot.map(x=>`<td class="n">${NI(x)}</td>`).join('')}<td class="n">${NI(tot.reduce((a,b)=>a+b,0))}</td></tr></tbody></table>`}

async function initPage(){
 const p=new URLSearchParams(location.search),o=p.get('origen')||'',code=(p.get('ceco')||'').trim().toUpperCase();
 $('cecoTitle').textContent=code||'CECO no indicado';$('cecoMeta').textContent=o;
 if(!o||!code){$('consBody').innerHTML='<div class="nohist error">Falta indicar la empresa o el código del CECO.</div>';return}
 try{
  const res=await fetch('./consumos/index.json?ts='+Date.now(),{cache:'no-store'});if(!res.ok)throw new Error('HTTP '+res.status);CONS=await res.json();
  const per=CONS.periodos||[];$('periodTitle').textContent='CONSUMOS'+(per.length?' · '+PM(per[0])+' – '+PM(per[per.length-1]):'');
  if(!CONS[o]||!CONS[o][code]){$('consBody').innerHTML='<div class="nohist">Sin consumos registrados para este CECO.</div>';return}
  try{const cr=await fetch('./cecos.json?ts='+Date.now(),{cache:'no-store'});if(cr.ok){const raw=await cr.json(),r=(raw.cecos||[]).find(x=>(x.Origen||x.origen)===o&&String(x.Codigo||x.codigo||'').trim().toUpperCase()===code);if(r)$('cecoTitle').textContent=(r.Descripcion||r.descripcion||code)+' · '+code}}catch(e){}
  await window.verCons(o,code,$('loadButton'));
 }catch(e){$('consBody').innerHTML='<div class="nohist error">No se pudieron cargar los consumos ('+E(e.message)+').</div>'}
}
initPage();
</script></body></html>
